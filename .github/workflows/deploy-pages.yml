name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/famfinance-ai-build-tkq17z
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: |
          # API routes cannot be statically exported — the client falls back
          # to its labeled mock-vision path when the route is absent.
          rm -rf app/api
          npx next build
          touch out/.nojekyll
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /FamFlow

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # The github-pages environment only permits deployments from main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
