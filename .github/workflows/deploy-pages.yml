name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/famfinance-ai-build-tkq17z
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: |
          # API routes cannot be statically exported — the client falls back
          # to its labeled mock-vision path when the route is absent.
          rm -rf app/api
          npx next build
          touch out/.nojekyll
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /FamFlow

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true

      - name: Point Pages at the gh-pages branch
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' \
            || echo "::warning::Pages source switch failed — set Settings → Pages → Source to gh-pages manually"
